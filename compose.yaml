services:
  chat-screenshots:
    build: .
    image: chat-screenshots:local
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:8100:8080"
    environment:
      CHAT_SCREENSHOTS_ACCESS_URL: "${CHAT_SCREENSHOTS_ACCESS_URL:-}"
    user: "${DATA_UID:-1000}:${DATA_GID:-1000}"
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
